# 当前本地作品环境使用单节点ES；Python连接层仍支持生产多节点TLS配置。
name: aicare-agent-elasticsearch

services:
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicare-agent-es-setup
    user: "0"
    command: >-
      bash -euc '
        if [ ! -f config/certs/ca/ca.crt ]; then
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -q config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/es01/es01.crt ]; then
          printf "instances:\n  - name: es01\n    dns: [es01, localhost]\n    ip: [127.0.0.1, 192.168.150.105]\n" > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key --out config/certs/es01.zip;
          unzip -q config/certs/es01.zip -d config/certs;
        fi;
        chown -R 1000:0 config/certs;
        find config/certs -type d -exec chmod 750 {} \;;
        find config/certs -type f -exec chmod 640 {} \;;
      '
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs
    restart: "no"

  es01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicare-agent-es01
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    secrets:
      - elastic_password
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs:ro
      - es-data:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./roles.yml:/usr/share/elasticsearch/config/roles.yml:ro
    ports:
      - "192.168.150.105:9200:9200"
    mem_limit: 1280m
    cpus: 1.5
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --fail --cacert config/certs/ca/ca.crt
          --user "elastic:$$(cat /run/secrets/elastic_password)"
          https://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  provision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicare-agent-es-provision
    depends_on:
      es01:
        condition: service_healthy
    user: "0"
    command: >-
      bash -euc '
        elastic_password="$$(cat /run/secrets/elastic_password)";
        agent_password="$$(cat /run/secrets/agent_password)";
        admin_password="$$(cat /run/secrets/admin_password)";
        curl --silent --show-error --fail --cacert config/certs/ca/ca.crt --user "elastic:$${elastic_password}" -H "Content-Type: application/json" -X POST https://es01:9200/_security/user/aicare_agent -d "{\"password\":\"$${agent_password}\",\"roles\":[\"aicare_agent_rag\"]}";
        curl --silent --show-error --fail --cacert config/certs/ca/ca.crt --user "elastic:$${elastic_password}" -H "Content-Type: application/json" -X POST https://es01:9200/_security/user/aicare_rag_admin -d "{\"password\":\"$${admin_password}\",\"roles\":[\"aicare_agent_rag_admin\"]}";
      '
    secrets:
      - elastic_password
      - agent_password
      - admin_password
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs:ro
    restart: "no"

secrets:
  elastic_password:
    file: ./secrets/elastic_password
  agent_password:
    file: ./secrets/agent_password
  admin_password:
    file: ./secrets/admin_password

volumes:
  es-certs:
    name: aicare-agent-es-certs
  es-data:
    name: aicare-agent-es-data
